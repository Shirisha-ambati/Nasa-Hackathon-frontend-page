<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Weather App</title>
  <link rel="stylesheet" href="nasa.css">
</head>
<body>
  <header>
        <div class="container">
          <div class="logo">
            <img src="Nasa logo image.png" alt="WeatherApp Logo" />
            <span class="logo-name">ClimaWatch</span>
          </div>
          
          <nav class="nav-links">
            <ul>
            <li><a href="nasa.html">Home</a></li>
            <li><a href="features.html">Features</a></li>
            <li><a href="demo.html">Demo</a></li>
            <li><a href="signup.html">Sign up</a></li>
            <li><a href="login.html">Log In</a></li>
            <li><a href="weather.html" class="guest">Guest User</a></li>
          </ul>
        </nav>
        
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </header>
  <!-- Login Form -->
  <section class="auth-container login">
    <div class="auth-box">
      <h2>Welcome Back 🌤️</h2>
      <p class="auth-sub">Login to access personalized weather insights</p>
      
      <form>
        <input type="email" placeholder="Email Address" required>
        <input type="password" placeholder="Password" required>
        
        <div class="auth-options">
          <label>
            <input type="checkbox"> Remember me
          </label>
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-auth">Login</button>
      </form>
    </div>
  </section>

</body>
</html>
