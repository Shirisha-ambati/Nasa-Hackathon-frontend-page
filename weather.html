<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Weather - Weather App</title>
  <link rel="stylesheet" href="nasa.css">
  <script src="nasa.js" defer></script>
</head>
<body>

  <!-- Navbar -->
 <header>
        <div class="container">
          <div class="logo">
            <img src="Nasa logo image.png" alt="WeatherApp Logo" />
            <span class="logo-name">ClimaWatch</span>
          </div>
          
          <nav class="nav-links">
            <ul>
            <li><a href="nasa.html">Home</a></li>
            <li><a href="features.html">Features</a></li>
            <li><a href="demo.html">Demo</a></li>
            <li><a href="signup.html">Sign up</a></li>
            <li><a href="login.html">Log In</a></li>
            
            
          </ul>
        </nav>
        
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </header>

  <!-- Weather Check Section -->
  <section class="weather-check">
    <div class="weather-box">
      <h1>🌤️ Check Weather Conditions</h1>
      <p>Know the best time for your outdoor plans — customized for your activity!</p>

      <form id="weatherForm">
        <input type="text" id="city" placeholder="Enter your city" required>
        
        <input type="datetime-local" id="datetime" required>

        <!-- Grouped Activity Dropdown -->
        <select id="activity" required>
          <option value="" disabled selected>Select your activity</option>
          
          <optgroup label="🌿 Personal Activities">
            <option value="vacation">Vacation</option>
            <option value="picnic">Picnic</option>
            <option value="camping">Camping</option>
            <option value="hiking">Hiking</option>
            <option value="jogging">Jogging</option>
            <option value="general_outdoor">General Outdoor</option>
          </optgroup>

          <optgroup label="🌾 Farming">
            <option value="harvesting">Harvesting</option>
            <option value="plucking">Plucking</option>
            <option value="irrigation">Irrigation</option>
            <option value="sowing">Sowing Seeds</option>
          </optgroup>

          <optgroup label="⚙️ Technical / Other">
            <option value="rocket_launch">Rocket Launch</option>
            <option value="outdoor_sports">Outdoor Sports</option>
            <option value="fishing">Fishing</option>
            <option value="photography">Photography</option>
          </optgroup>
        </select>

        <button type="submit" class="btn-main">Get Weather</button>
      </form>

      <div id="result" class="result-box"></div>
    </div>
  </section>

</body>
</html>
