<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Weather App</title>
  <link rel="stylesheet" href="nasa.css">
</head>
<body>

  <!-- Navigation Bar -->
   <header>
        <div class="container">
          <div class="logo">
            <img src="Nasa logo image.png" alt="WeatherApp Logo" />
            <span class="logo-name">ClimaWatch</span>
          </div>
          
          <nav class="nav-links">
            <ul>
            <li><a href="nasa.html">Home</a></li>
            <li><a href="features.html">Features</a></li>
            <li><a href="demo.html">Demo</a></li>
            <li><a href="signup.html">Sign up</a></li>
            <li><a href="login.html">Log In</a></li>
            <li><a href="weather.html" class="guest">Guest User</a></li>
          </ul>
        </nav>
        
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </header>

  <!-- Sign Up Form -->
  <section class="auth-container">
    <div class="auth-box">
      <h2>Create Account 🌍</h2>
      <p class="auth-sub">Join us and get personalized weather forecasts</p>
      
      <form>
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email Address" required>
        <input type="password" placeholder="Password" required>
        <input type="password" placeholder="Confirm Password" required>

        <button type="submit" class="btn-auth">Sign Up</button>
      </form>

      <p class="auth-footer">Already have an account? <a href="signin.html">Sign In</a></p>
    </div>
  </section>

</body>
</html>
